name: Android voice CLI

on:
  workflow_dispatch:
  push:
    branches: [termux]
    paths:
      - codex-rs/**
      - third_party/**
      - .github/workflows/android-voice-cli.yml
      - scripts/**

permissions:
  contents: read

concurrency:
  group: android-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tui-tests:
    name: Voice UI regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libcap-dev libasound2-dev protobuf-compiler bubblewrap
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,cargo-nextest@0.9.146

      - name: Restore test cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: voice-tui-tests-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            voice-tui-tests-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-

      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt -p codex-tui -- --check --config imports_granularity=Item

      - name: Run TUI tests
        working-directory: codex-rs
        run: just test -p codex-tui

  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      # Matches the development voice helper already built on the phone.
      STABLE_GIT_COMMIT: dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Restore Rust cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: android-voice-dev-1.95-ndk28-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            android-voice-dev-1.95-ndk28-${{ hashFiles('codex-rs/Cargo.lock') }}-

      - name: Build CLI for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$toolchain/bin:$PATH"
          export CC_aarch64_linux_android=aarch64-linux-android29-clang
          export CXX_aarch64_linux_android=aarch64-linux-android29-clang++
          export AR_aarch64_linux_android=llvm-ar
          export RANLIB_aarch64_linux_android=llvm-ranlib
          export LIBLZMA_NO_PKG_CONFIG=1
          export OPENSSL_NO_PKG_CONFIG=1
          export PKG_CONFIG_ALLOW_CROSS=1
          export PROTOC=/usr/bin/protoc
          cd codex-rs
          cargo +1.95.0 build --locked --target aarch64-linux-android -p codex-cli

      - name: Prepare downloadable files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/bin
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          cp codex-rs/target/aarch64-linux-android/debug/codex artifact/bin/codex
          cp "$toolchain/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" artifact/bin/
          "$toolchain/bin/llvm-strip" --strip-debug artifact/bin/codex
          printf '%s\n' "$GITHUB_SHA" > artifact/SOURCE_COMMIT.txt
          printf '%s\n' 'Development CLI only. Combine with the Termux voice helper, GStreamer libraries and code-mode host.' > artifact/README.txt
          cd artifact
          sha256sum bin/* > SHA256SUMS

      - name: Upload CLI
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: android-voice-cli-${{ github.sha }}
          path: artifact/
          retention-days: 3
          if-no-files-found: error
